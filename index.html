<!DOCTYPE html>
<html>
<head>
  <style>
    /* 1. Center the flag on the screen */
    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* 2. Container to keep the stick and flag side-by-side */
    .flag-container {
      display: flex;
      align-items: flex-start;
    }

    /* 3. Brown Flagstick */
    .stick {
      width: 10px;
      height: 320px;
      background-color: #8B4513; /* Saddle Brown */
      border-radius: 4px;
    }

    /* 4. The Flag Box */
    .flag {
      width: 210px;
      height: 140px;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2); /* Soft shadow */
    }

    /* 5. Three Equal Stripes */
    .stripe {
      height: 46.6px; /* Exactly 1/3 of the flag height */
    }

    .saffron {
      background-color: #FF9933; /* Top stripe */
    }

    .white {
      background-color: #FFFFFF; /* Middle stripe */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .green {
      background-color: #138808; /* Bottom stripe */
    }

    /* 6. Ashoka Chakra (Navy Blue Wheel) */
    .chakra {
      width: 38px;
      height: 38px;
      border: 3px solid #000080; /* Navy Blue border */
      border-radius: 50%;        /* Makes it a circle */
      box-sizing: border-box;
      position: relative;
    }

    /* Center dot of the Ashoka Chakra */
    .chakra-dot {
      width: 8px;
      height: 8px;
      background-color: #000080;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <!-- Main Container -->
  <div class="flag-container">
    
    <!-- Flagstick -->
    <div class="stick"></div>

    <!-- Flag Cloth -->
    <div class="flag">
      <div class="stripe saffron"></div>
      
      <div class="stripe white">
        <div class="chakra">
          <div class="chakra-dot"></div>
        </div>
      </div>
      
      <div class="stripe green"></div>
    </div>

  </div>

</body>
</html>
